<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Eye — Driver Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark se-navbar px-3">
    <span class="navbar-brand">🛡️ Secure Eye — Driver</span>
    <div>
      <span class="text-white-50 me-3" id="userLabel"></span>
      <button id="logoutBtn" class="btn btn-sm btn-outline-light">Logout</button>
    </div>
  </nav>

  <main class="container py-4">
    <div class="card se-card p-3 mb-4">
      <h5>My Vehicle</h5>
      <select id="vehicleSelect" class="form-select mb-3"></select>
      <div class="d-flex gap-2 align-items-center">
        <button id="tripToggle" class="btn btn-primary">Start Trip (broadcast GPS)</button>
        <span id="tripStatus" class="text-muted">Trip not started</span>
      </div>
      <div class="mt-2 small text-muted" id="lastPing"></div>
    </div>

    <div class="card se-card p-3">
      <h5>Report an Incident</h5>
      <form id="incidentForm" class="row g-2">
        <div class="col-md-10"><input class="form-control" name="details" placeholder="Describe the incident" required></div>
        <div class="col-md-2"><button class="btn btn-outline-danger w-100" type="submit">Report</button></div>
      </form>
      <div id="incidentResult" class="mt-2"></div>
      <p class="small text-muted mt-2 mb-0">Demo only — incident reports are not yet persisted to the database (see README's "Known limitations").</p>
    </div>
  </main>

  <script src="assets/js/api.js"></script>
  <script>
    const user = Session.requireRole(['driver']);
    document.getElementById('userLabel').textContent = `${user.name} (${user.role})`;
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await Api.logout().catch(() => {});
      Session.clear();
      window.location.href = 'index.html';
    });

    let pingTimer = null;

    async function loadVehicles() {
      const vehicles = await Api.vehicles.list();
      document.getElementById('vehicleSelect').innerHTML = vehicles
        .map((v) => `<option value="${v.id}">${v.plate_number}</option>`)
        .join('');
    }

    function getPosition() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(new Error('Geolocation not supported'));
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
          (err) => reject(err)
        );
      });
    }

    async function broadcastOnce() {
      const vehicleId = Number(document.getElementById('vehicleSelect').value);
      try {
        const pos = await getPosition();
        await Api.vehicles.ping(vehicleId, pos.lat, pos.lng);
        document.getElementById('lastPing').textContent =
          `Last broadcast: ${pos.lat.toFixed(5)}, ${pos.lng.toFixed(5)} at ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        document.getElementById('lastPing').textContent = `GPS broadcast failed: ${err.message}`;
      }
    }

    document.getElementById('tripToggle').addEventListener('click', (e) => {
      if (pingTimer) {
        clearInterval(pingTimer);
        pingTimer = null;
        e.target.textContent = 'Start Trip (broadcast GPS)';
        document.getElementById('tripStatus').textContent = 'Trip not started';
      } else {
        broadcastOnce();
        pingTimer = setInterval(broadcastOnce, 30000); // every 30s, per the deck's spec
        e.target.textContent = 'End Trip';
        document.getElementById('tripStatus').textContent = 'Trip in progress — broadcasting every 30s';
      }
    });

    document.getElementById('incidentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const details = new FormData(e.target).get('details');
      // TODO: wire to a persisted incidents table/endpoint — this UI is a
      // stub for the demo and does not yet call the backend.
      document.getElementById('incidentResult').innerHTML =
        `<div class="alert alert-warning">Recorded locally only — incident persistence is not implemented yet: "${details}"</div>`;
      e.target.reset();
    });

    loadVehicles();
  </script>
</body>
</html>
