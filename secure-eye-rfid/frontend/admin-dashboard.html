<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Eye — Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark se-navbar px-3">
    <span class="navbar-brand">🛡️ Secure Eye — Admin</span>
    <div>
      <span class="text-white-50 me-3" id="userLabel"></span>
      <button id="logoutBtn" class="btn btn-sm btn-outline-light">Logout</button>
    </div>
  </nav>

  <main class="container py-4">
    <ul class="nav nav-tabs mb-4" id="tabs">
      <li class="nav-item"><button class="nav-link active" data-tab="overview">Overview</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="students">Students</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="vehicles">Vehicles</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="routes">Routes</button></li>
    </ul>

    <section id="tab-overview">
      <div class="row g-3 mb-4">
        <div class="col-md-3"><div class="card se-card p-3"><div class="text-muted small">Students</div><div class="se-stat-value" id="statStudents">–</div></div></div>
        <div class="col-md-3"><div class="card se-card p-3"><div class="text-muted small">Vehicles</div><div class="se-stat-value" id="statVehicles">–</div></div></div>
        <div class="col-md-3"><div class="card se-card p-3"><div class="text-muted small">Routes</div><div class="se-stat-value" id="statRoutes">–</div></div></div>
        <div class="col-md-3"><div class="card se-card p-3"><div class="text-muted small">Boardings (7d)</div><div class="se-stat-value" id="statBoardings">–</div></div></div>
      </div>
      <div class="card se-card p-3">
        <h5>Attendance — last 7 days</h5>
        <canvas id="attendanceChart" height="90"></canvas>
      </div>
    </section>

    <section id="tab-students" class="d-none">
      <div class="card se-card p-3 mb-3">
        <h5>Add Student</h5>
        <form id="studentForm" class="row g-2">
          <div class="col-md-3"><input class="form-control" name="rfid_uid" placeholder="RFID UID" required></div>
          <div class="col-md-3"><input class="form-control" name="full_name" placeholder="Full name" required></div>
          <div class="col-md-2"><input class="form-control" name="class" placeholder="Class" required></div>
          <div class="col-md-2"><select class="form-select" name="route_id" id="studentRouteSelect"></select></div>
          <div class="col-md-2"><button class="btn btn-primary w-100" type="submit">Add</button></div>
        </form>
      </div>
      <div class="card se-card p-3">
        <table class="table table-hover">
          <thead><tr><th>Name</th><th>Class</th><th>RFID UID</th><th>Status</th></tr></thead>
          <tbody id="studentsTable"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-vehicles" class="d-none">
      <div class="card se-card p-3 mb-3">
        <h5>Add Vehicle</h5>
        <form id="vehicleForm" class="row g-2">
          <div class="col-md-4"><input class="form-control" name="plate_number" placeholder="Plate number" required></div>
          <div class="col-md-3"><input class="form-control" type="number" name="capacity" placeholder="Capacity" value="33"></div>
          <div class="col-md-3"><input class="form-control" name="gps_device_id" placeholder="GPS device ID"></div>
          <div class="col-md-2"><button class="btn btn-primary w-100" type="submit">Add</button></div>
        </form>
      </div>
      <div class="card se-card p-3">
        <table class="table table-hover">
          <thead><tr><th>Plate</th><th>Capacity</th><th>Last Location</th><th>Last Ping</th></tr></thead>
          <tbody id="vehiclesTable"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-routes" class="d-none">
      <div class="card se-card p-3 mb-3">
        <h5>Add Route</h5>
        <form id="routeForm" class="row g-2">
          <div class="col-md-5"><input class="form-control" name="name" placeholder="Route name" required></div>
          <div class="col-md-3"><input class="form-control" type="time" name="schedule_time"></div>
          <div class="col-md-2"><button class="btn btn-primary w-100" type="submit">Add</button></div>
        </form>
      </div>
      <div class="card se-card p-3">
        <table class="table table-hover">
          <thead><tr><th>Route</th><th>Schedule</th></tr></thead>
          <tbody id="routesTable"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    const user = Session.requireRole(['admin', 'coordinator']);
    document.getElementById('userLabel').textContent = `${user.name} (${user.role})`;
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await Api.logout().catch(() => {});
      Session.clear();
      window.location.href = 'index.html';
    });

    document.querySelectorAll('#tabs button').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#tabs button').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('main > section').forEach((s) => s.classList.add('d-none'));
        document.getElementById(`tab-${btn.dataset.tab}`).classList.remove('d-none');
      });
    });

    let routesCache = [];

    async function loadOverview() {
      const [students, vehicles, routes, attendance] = await Promise.all([
        Api.students.list(), Api.vehicles.list(), Api.routes.list(), Api.reports.attendance(),
      ]);
      document.getElementById('statStudents').textContent = students.length;
      document.getElementById('statVehicles').textContent = vehicles.length;
      document.getElementById('statRoutes').textContent = routes.length;
      document.getElementById('statBoardings').textContent =
        attendance.reduce((sum, r) => sum + Number(r.boardings), 0);

      const byDay = {};
      attendance.forEach((r) => { byDay[r.day] = (byDay[r.day] || 0) + Number(r.boardings); });
      const labels = Object.keys(byDay).sort();

      new Chart(document.getElementById('attendanceChart'), {
        type: 'bar',
        data: { labels, datasets: [{ label: 'Boardings', data: labels.map((d) => byDay[d]), backgroundColor: '#0d6efd' }] },
        options: { responsive: true, scales: { y: { beginAtZero: true } } },
      });
    }

    async function loadStudents() {
      const students = await Api.students.list();
      document.getElementById('studentsTable').innerHTML = students.map((s) => `
        <tr><td>${s.full_name}</td><td>${s.class}</td><td>${s.rfid_uid}</td>
        <td>${s.is_active ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-secondary">Inactive</span>'}</td></tr>
      `).join('');
    }

    async function loadVehicles() {
      const vehicles = await Api.vehicles.list();
      document.getElementById('vehiclesTable').innerHTML = vehicles.map((v) => `
        <tr><td>${v.plate_number}</td><td>${v.capacity}</td>
        <td>${v.last_lat ? `${v.last_lat}, ${v.last_lng}` : '—'}</td>
        <td>${v.last_ping_at || 'Never'}</td></tr>
      `).join('');
    }

    async function loadRoutes() {
      routesCache = await Api.routes.list();
      document.getElementById('routesTable').innerHTML = routesCache.map((r) => `
        <tr><td>${r.name}</td><td>${r.schedule_time || '—'}</td></tr>
      `).join('');
      document.getElementById('studentRouteSelect').innerHTML =
        '<option value="">No route</option>' +
        routesCache.map((r) => `<option value="${r.id}">${r.name}</option>`).join('');
    }

    document.getElementById('studentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      await Api.students.create({
        rfid_uid: fd.get('rfid_uid'),
        full_name: fd.get('full_name'),
        class: fd.get('class'),
        route_id: fd.get('route_id') || null,
      });
      e.target.reset();
      loadStudents();
    });

    document.getElementById('vehicleForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      await Api.vehicles.create({
        plate_number: fd.get('plate_number'),
        capacity: Number(fd.get('capacity')),
        gps_device_id: fd.get('gps_device_id'),
      });
      e.target.reset();
      loadVehicles();
    });

    document.getElementById('routeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      await Api.routes.create({ name: fd.get('name'), schedule_time: fd.get('schedule_time') || null });
      e.target.reset();
      loadRoutes();
    });

    (async () => {
      await loadRoutes();
      await Promise.all([loadOverview(), loadStudents(), loadVehicles()]);
    })();
  </script>
</body>
</html>
