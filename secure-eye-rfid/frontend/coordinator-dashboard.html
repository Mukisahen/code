<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Eye — Coordinator Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark se-navbar px-3">
    <span class="navbar-brand">🛡️ Secure Eye — Coordinator</span>
    <div>
      <span class="text-white-50 me-3" id="userLabel"></span>
      <button id="logoutBtn" class="btn btn-sm btn-outline-light">Logout</button>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row g-3 mb-4">
      <div class="col-md-4"><div class="card se-card p-3"><div class="text-muted small">Routes</div><div class="se-stat-value" id="statRoutes">–</div></div></div>
      <div class="col-md-4"><div class="card se-card p-3"><div class="text-muted small">Vehicles</div><div class="se-stat-value" id="statVehicles">–</div></div></div>
      <div class="col-md-4"><div class="card se-card p-3"><div class="text-muted small">Scans (30d)</div><div class="se-stat-value" id="statScans">–</div></div></div>
    </div>

    <div class="card se-card p-3 mb-4">
      <h5>Fleet Utilisation — last 30 days</h5>
      <table class="table table-hover">
        <thead><tr><th>Vehicle</th><th>Scans</th><th>Unique Students Carried</th></tr></thead>
        <tbody id="utilisationTable"></tbody>
      </table>
    </div>

    <div class="card se-card p-3">
      <h5>Routes &amp; Vehicle Assignment</h5>
      <table class="table table-hover">
        <thead><tr><th>Route</th><th>Schedule</th><th>Assigned Vehicle</th></tr></thead>
        <tbody id="routesTable"></tbody>
      </table>
    </div>
  </main>

  <script src="assets/js/api.js"></script>
  <script>
    const user = Session.requireRole(['coordinator', 'admin']);
    document.getElementById('userLabel').textContent = `${user.name} (${user.role})`;
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await Api.logout().catch(() => {});
      Session.clear();
      window.location.href = 'index.html';
    });

    (async () => {
      const [routes, vehicles, utilisation] = await Promise.all([
        Api.routes.list(), Api.vehicles.list(), Api.reports.fleetUtilisation(),
      ]);

      document.getElementById('statRoutes').textContent = routes.length;
      document.getElementById('statVehicles').textContent = vehicles.length;
      document.getElementById('statScans').textContent =
        utilisation.reduce((sum, r) => sum + Number(r.scan_count), 0);

      const vehicleById = Object.fromEntries(vehicles.map((v) => [v.id, v.plate_number]));

      document.getElementById('routesTable').innerHTML = routes.map((r) => `
        <tr><td>${r.name}</td><td>${r.schedule_time || '—'}</td>
        <td>${vehicleById[r.vehicle_id] || '<span class="text-muted">Unassigned</span>'}</td></tr>
      `).join('');

      document.getElementById('utilisationTable').innerHTML = utilisation.map((u) => `
        <tr><td>${u.plate_number}</td><td>${u.scan_count}</td><td>${u.unique_students}</td></tr>
      `).join('') || '<tr><td colspan="3" class="text-muted">No trips recorded yet</td></tr>';
    })();
  </script>
</body>
</html>
