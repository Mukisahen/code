<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure Eye — RFID Kiosk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark se-navbar px-3">
    <span class="navbar-brand">🛡️ Secure Eye — RFID Kiosk</span>
    <div>
      <select id="vehicleSelect" class="form-select form-select-sm d-inline-block w-auto me-2"></select>
      <select id="eventType" class="form-select form-select-sm d-inline-block w-auto me-2">
        <option value="board">Boarding</option>
        <option value="alight">Alighting</option>
      </select>
      <button id="logoutBtn" class="btn btn-sm btn-outline-light">Logout</button>
    </div>
  </nav>

  <main class="container py-5 text-center">
    <div class="card se-card mx-auto p-5" style="max-width: 560px;" id="scanCard">
      <div style="font-size: 4rem;">📡</div>
      <h2 class="mt-2">Tap RFID Card</h2>
      <p class="text-muted">Hold the student's card near the USB reader.</p>
      <input type="text" id="rfidInput" class="form-control form-control-lg text-center mt-3"
             placeholder="Waiting for card…" autocomplete="off">
      <div id="resultBox" class="mt-4"></div>
    </div>

    <div class="mt-4 text-muted small">
      A USB RFID reader behaves like a keyboard — this field stays focused and
      auto-submits when a card's UID is scanned (reader sends UID + Enter).
    </div>
  </main>

  <script src="assets/js/api.js"></script>
  <script>
    Session.requireRole(['scanner']);
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await Api.logout().catch(() => {});
      Session.clear();
      window.location.href = 'index.html';
    });

    const rfidInput = document.getElementById('rfidInput');
    const resultBox = document.getElementById('resultBox');
    const scanCard = document.getElementById('scanCard');
    const vehicleSelect = document.getElementById('vehicleSelect');

    async function loadVehicles() {
      try {
        const vehicles = await Api.vehicles.list();
        vehicleSelect.innerHTML = vehicles
          .map((v) => `<option value="${v.id}">${v.plate_number}</option>`)
          .join('');
      } catch (err) {
        resultBox.innerHTML = `<div class="alert alert-warning">Could not load vehicles: ${err.message}</div>`;
      }
    }

    function refocus() {
      rfidInput.value = '';
      rfidInput.focus();
    }

    async function handleScan(rfidUid) {
      resultBox.innerHTML = '<div class="text-muted">Looking up card…</div>';
      try {
        const geo = await new Promise((resolve) => {
          if (!navigator.geolocation) return resolve({});
          navigator.geolocation.getCurrentPosition(
            (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
            () => resolve({})
          );
        });

        const data = await Api.scan({
          rfid_uid: rfidUid,
          vehicle_id: Number(vehicleSelect.value),
          event_type: document.getElementById('eventType').value,
          lat: geo.lat ?? null,
          lng: geo.lng ?? null,
        });

        scanCard.classList.add('se-scan-flash');
        setTimeout(() => scanCard.classList.remove('se-scan-flash'), 600);

        resultBox.innerHTML = `
          <div class="alert alert-success">
            <strong>${data.student.full_name}</strong> (${data.student.class})<br>
            ${data.event_type === 'board' ? 'Boarded' : 'Alighted'} — event #${data.event_id}<br>
            ${data.notification ? `Parent notified: ${data.notification.status}` : 'No parent linked'}
          </div>`;
      } catch (err) {
        resultBox.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
      } finally {
        refocus();
      }
    }

    rfidInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && rfidInput.value.trim() !== '') {
        handleScan(rfidInput.value.trim());
      }
    });

    document.addEventListener('click', refocus);
    loadVehicles();
    refocus();
  </script>
</body>
</html>
