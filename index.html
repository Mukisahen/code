<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1E7A34" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Farm Bhade" />
    <meta
      name="description"
      content="Farm Bhade — the AI-powered digital maize ecosystem for Uganda's farmers, buyers, processors and administrators. From Seed to Market."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Farm Bhade — From Seed to Market</title>
    <style>
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: linear-gradient(135deg, #1e7a34, #155c24);
        color: #fff;
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
        z-index: 9999;
      }
      #app-loading .mark {
        width: 88px;
        height: 88px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app-loading .mark svg {
        width: 44px;
        height: 44px;
      }
      #app-loading .name {
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -0.02em;
      }
      #app-loading .dots span {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin: 0 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.85);
        animation: app-loading-bounce 1s infinite ease-in-out;
      }
      #app-loading .dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      #app-loading .dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes app-loading-bounce {
        0%,
        80%,
        100% {
          transform: scale(0.6);
          opacity: 0.6;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }
      #app-loading.is-hidden {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease-out;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-loading" aria-hidden="true">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20V10" />
          <path d="M12 10C12 5 8 3 4 3c0 5 4 7 8 7Z" fill="currentColor" stroke="none" opacity="0.9" />
          <path d="M12 12c0-5 4-7 8-7 0 5-4 7-8 7Z" fill="currentColor" stroke="none" />
        </svg>
      </div>
      <div class="name">Farm Bhade</div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
