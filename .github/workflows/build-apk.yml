name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/farm-bhade-pwa-frontend-x4ejjk
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - ".env.production"
      - "package.json"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed so the release-publishing step below can create/update a
    # GitHub Release using the default GITHUB_TOKEN.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm ci

      - name: Build the PWA (bakes VITE_API_URL from .env.production into the bundle)
        run: npm run build

      - name: Sync web build into the native Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: farm-bhade-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # Workflow artifacts (above) require a GitHub login to download and
      # get auto-evicted once the account's 500MB Actions storage quota
      # fills up — after enough builds in one day, that quota fills fast
      # and starts deleting even recently-built artifacts. A GitHub Release
      # asset has no such quota, needs no login to download, and this job
      # updates the same "apk-latest" release every run, so the link below
      # never changes and always serves the newest build.
      - name: Publish stable APK download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Farm Bhade — Latest APK
          body: |
            Always the most recent Android build from `claude/farm-bhade-pwa-frontend-x4ejjk`.
            This link never changes — bookmark it instead of a per-run Actions artifact link.

            Built from commit ${{ github.sha }}.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
