databases:
  - name: farm-bhade-db
    plan: free
    databaseName: farmbhade
    user: farmbhade

services:
  - type: web
    name: farm-bhade-api
    runtime: node
    plan: free
    rootDir: server
    # --include=dev is required here: NODE_ENV=production (set below) makes a
    # plain `npm install` skip devDependencies, which is where typescript,
    # @types/*, and prisma's CLI live — without this flag tsc fails with
    # "Cannot find module" on every import.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: >-
      sh -c "npx prisma migrate deploy &&
      (if [ -n \"$SUPER_ADMIN_PHONE\" ]; then npm run create-admin; fi) &&
      npm run create-demo &&
      npm run start"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: farm-bhade-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000
      - key: UPLOADS_DIR
        value: ./uploads
      # Comma-separated: the web PWA's own origin, plus the Capacitor Android
      # app's internal WebView origin (it doesn't request from the PWA's URL).
      - key: CORS_ORIGIN
        value: https://farm-bhade-pwa.onrender.com,https://localhost,http://localhost
      - key: PUBLIC_UPLOADS_BASE_URL
        value: https://farm-bhade-api.onrender.com/uploads
      # Optional: powers the Ask AI chatbot with real Claude responses instead
      # of the local keyword-matched FAQ fallback. Get a key from
      # https://console.anthropic.com/ and add it here.
      # - key: ANTHROPIC_API_KEY
      #   value: "your-anthropic-api-key"
      # Set these two temporarily to bootstrap the real supreme admin on first
      # deploy (see server/README.md), then delete them and redeploy — do not
      # leave a real password sitting in the dashboard long-term.
      # - key: SUPER_ADMIN_PHONE
      #   value: "+2567XXXXXXXX"
      # - key: SUPER_ADMIN_PASSWORD
      #   value: "a long random password, at least 12 characters"

  - type: web
    name: farm-bhade-pwa
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://farm-bhade-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
